<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Limamöykky: a green slime blob that looks to the right -->
  <defs>
    <radialGradient id="lima" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b8ff7a"/>
      <stop offset="0.6" stop-color="#4cd137"/>
      <stop offset="1" stop-color="#218c3a"/>
    </radialGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="50" cy="93" rx="38" ry="5" fill="#000" opacity="0.18"/>
  <!-- body -->
  <path d="M10 88 C6 60 22 22 50 20 C80 18 96 58 90 88 C80 94 68 88 62 92 C55 96 45 96 38 92 C30 88 20 94 10 88 Z"
        fill="url(#lima)" stroke="#1b6b2c" stroke-width="3" stroke-linejoin="round"/>
  <!-- shine -->
  <ellipse cx="34" cy="38" rx="9" ry="6" fill="#fff" opacity="0.55" transform="rotate(-25 34 38)"/>
  <!-- eyes, looking right -->
  <ellipse cx="54" cy="52" rx="10" ry="12" fill="#fff" stroke="#1b6b2c" stroke-width="2"/>
  <ellipse cx="76" cy="52" rx="9" ry="11" fill="#fff" stroke="#1b6b2c" stroke-width="2"/>
  <circle cx="58" cy="54" r="5" fill="#222"/>
  <circle cx="79" cy="54" r="4.5" fill="#222"/>
  <circle cx="60" cy="52" r="1.6" fill="#fff"/>
  <circle cx="80.5" cy="52" r="1.4" fill="#fff"/>
  <!-- smile -->
  <path d="M60 72 Q68 79 77 71" fill="none" stroke="#1b6b2c" stroke-width="3" stroke-linecap="round"/>
</svg>
